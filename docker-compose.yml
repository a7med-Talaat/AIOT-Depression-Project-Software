version: '3.9'

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: aiot_postgres
    environment:
      POSTGRES_USER: aiot_user
      POSTGRES_PASSWORD: aiot_secure_password
      POSTGRES_DB: aiot_depression_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiot_user -d aiot_depression_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiot_network
    restart: unless-stopped

  # ============================================================
  # Mosquitto MQTT Broker
  # ============================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aiot_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiot_network
    restart: unless-stopped

  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiot_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aiot_user:aiot_secure_password@postgres:5432/aiot_depression_db
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      JWT_SECRET: your-super-secret-jwt-key-change-in-production-min-32-chars
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_HOURS: 24
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
      ML_MODEL_PATH: /app/ml_models/depression_model.pkl
      ML_SCALER_PATH: /app/ml_models/scaler.pkl
      LOG_LEVEL: INFO
      ENVIRONMENT: production
    volumes:
      - ./ml/models:/app/ml_models:ro
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aiot_network
    restart: unless-stopped

  # ============================================================
  # Next.js Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiot_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_APP_NAME: "AIoT Depression Monitor"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aiot_network
    restart: unless-stopped

  # ============================================================
  # pgAdmin (Database Management UI)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aiot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aiot.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - aiot_network
    restart: unless-stopped
    profiles:
      - dev

  # ============================================================
  # Nginx Reverse Proxy (Production)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: aiot_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aiot_network
    restart: unless-stopped
    profiles:
      - production

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  backend_logs:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  aiot_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
